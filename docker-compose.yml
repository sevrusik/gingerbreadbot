version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: gingerbread-db
    restart: always
    environment:
      POSTGRES_USER: gingerbread_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
      POSTGRES_DB: gingerbread_bot
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gingerbread_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gingerbread-network

  # Telegram бот
  bot:
    build: .
    container_name: gingerbread-bot
    restart: always
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    env_file:
      - .env
    environment:
      # Переменные из .env, но можно переопределить здесь
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
      - ./media:/app/media
      - ./database:/app/database
    networks:
      - gingerbread-network

networks:
  gingerbread-network:
    driver: bridge
